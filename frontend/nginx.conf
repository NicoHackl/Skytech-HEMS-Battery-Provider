# Auslieferung des Vite-Builds: statische Dateien + SPA-Fallback,
# API und Medien an den Anwendungsserver weiterleiten (gleiche Origin).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10m;   # Uploads
    }

    location /media/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }

    # SPA-Fallback: jede unbekannte Route liefert die index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
