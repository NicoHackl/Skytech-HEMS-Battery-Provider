<!doctype html>
<!-- data-design waehlt die Designsprache: "ha" (Home Assistant, Akzent #18BCF2)
     oder "fcr" (Vereinsfarben FC Ruderting). Es gibt keinen Default — steht hier
     etwas anderes, bleibt der Akzent grau und die Oberflaeche sichtbar unfertig.
     init-projekt.sh setzt den Wert ueber --design; welche Sprache gilt, wird
     erfragt statt geraten (AGENTS.md, eiserne Regel 10).
     data-theme setzt das Skript unten und danach der ThemeProvider. -->
<html lang="de" data-design="{{DESIGN}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f7" />
    <!-- Interne Oberflaechen gehoeren nicht in Suchmaschinen: -->
    <meta name="robots" content="noindex, nofollow" />
    <title>{{PROJEKT_NAME}} – Verwaltung</title>
    <script>
      /* Hell/Dunkel vor dem ersten Frame festlegen. Laeuft React erst spaeter an,
         blitzt sonst die helle Oberflaeche auf. Faellt localStorage aus (privater
         Modus), bleibt data-theme leer und styles.css folgt der Systemvorgabe. */
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
        } catch (error) {
          /* bewusst leer — die Systemvorgabe im CSS greift */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
